name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  cache: "npm"

            - run: npm ci

            - name: Build (lints via CI=true)
              run: npm run build
              env:
                  CI: true

            - name: Test
              run: npm test -- --watchAll=false
              env:
                  CI: true

            - name: Test server.js
              run: npm run test:server
